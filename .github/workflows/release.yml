# SimFone MDM automated release.
#
# Bump versionCode (and versionName) in app/build.gradle and push to master:
# this workflow tests, builds, signs and publishes GitHub release v<versionName>.
#   - versionName with a "-" (0.2.0-exp.1, 1.0.0-rc.2) -> pre-release, otherwise a normal release
#   - nothing happens if versionCode didn't change (or v<versionName> is already released)
#   - fails if versionCode is not higher than the last release's (DO self-updates need it to grow)
# "Run workflow" (manual) releases the current version if it isn't released yet.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   SIMFONE_KEYSTORE_B64       base64 of the release .jks      (required for normal releases)
#   SIMFONE_KEYSTORE_PASSWORD, SIMFONE_KEY_ALIAS, SIMFONE_KEY_PASSWORD
#   SIMFONE_REQUEST_SIGNATURE  server hash.secret
#   SIMFONE_LIBRARY_API_KEY    shared with launcher / KyCall / dpadsms
#   SIMFONE_MANIFEST_PUBKEY    fallback manifest public key (optional)
#   SIMFONE_MANIFEST_URL       fallback manifest URL (optional)
# Without the keystore secret, a pre-release is signed with a throwaway key and marked
# "NOT FOR FLEET" (it can never be updated by a release-signed build). Normal releases fail.

name: Release

on:
  push:
    branches: [master]
    paths: ['app/build.gradle', '.github/workflows/release.yml']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Version from app/build.gradle
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CODE=$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\1/p' app/build.gradle | head -1)
          NAME=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*/\1/p' app/build.gradle | head -1)
          [[ -n "$CODE" && -n "$NAME" ]] || { echo "::error::versionCode/versionName not found in app/build.gradle"; exit 1; }
          [[ "$NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::versionName $NAME must be MAJOR.MINOR.PATCH[-suffix]"; exit 1; }
          TAG="v$NAME"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Highest versionCode already released (recorded in each release body)
          LAST=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName --jq '.[].tagName' \
                 | while read -r t; do gh release view "$t" --repo "$GITHUB_REPOSITORY" --json body --jq .body \
                 | sed -nE 's/.*versionCode ([0-9]+).*/\1/p' | head -1; done | sort -n | tail -1)
          LAST=${LAST:-0}
          if (( CODE <= LAST )); then
            echo "::error::versionCode $CODE is not higher than the last released versionCode $LAST. Bump it."
            exit 1
          fi
          if [[ "$NAME" == *-* ]]; then echo "PRERELEASE=true" >> "$GITHUB_ENV"; else echo "PRERELEASE=false" >> "$GITHUB_ENV"; fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "SIMFONE_VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "SIMFONE_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG (versionCode $CODE, previous $LAST)"

      - uses: actions/setup-java@v5
        if: steps.version.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # GitHub runners ship the Android SDK; just make sure our platform/build-tools are there.
      # (android-actions/setup-android@v3 fails: it installs the removed legacy "tools" package.)
      - name: Android SDK packages
        if: steps.version.outputs.skip != 'true'
        run: |
          set -euo pipefail
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null
          echo "Using $SDKM"

      - name: Build secrets
        if: steps.version.outputs.skip != 'true'
        env:
          KEYSTORE_B64: ${{ secrets.SIMFONE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SIMFONE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIMFONE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIMFONE_KEY_PASSWORD }}
          REQUEST_SIGNATURE: ${{ secrets.SIMFONE_REQUEST_SIGNATURE }}
          LIBRARY_API_KEY: ${{ secrets.SIMFONE_LIBRARY_API_KEY }}
          MANIFEST_PUBKEY: ${{ secrets.SIMFONE_MANIFEST_PUBKEY }}
          MANIFEST_URL: ${{ secrets.SIMFONE_MANIFEST_URL }}
        run: |
          set -euo pipefail
          mkdir -p ~/.gradle
          props=~/.gradle/gradle.properties
          : > "$props"
          [[ -n "$REQUEST_SIGNATURE" ]] && echo "SIMFONE_REQUEST_SIGNATURE=$REQUEST_SIGNATURE" >> "$props"
          [[ -n "$LIBRARY_API_KEY" ]] && echo "SIMFONE_LIBRARY_API_KEY=$LIBRARY_API_KEY" >> "$props"
          [[ -n "$MANIFEST_PUBKEY" ]] && echo "SIMFONE_MANIFEST_PUBKEY=$MANIFEST_PUBKEY" >> "$props"
          [[ -n "$MANIFEST_URL" ]] && echo "SIMFONE_MANIFEST_URL=$MANIFEST_URL" >> "$props"
          if [[ -n "$KEYSTORE_B64" ]]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "SIMFONE_KEYSTORE=$RUNNER_TEMP/release.jks"
              echo "SIMFONE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "SIMFONE_KEY_ALIAS=$KEY_ALIAS"
              echo "SIMFONE_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$props"
            echo "SIGNING=release" >> "$GITHUB_ENV"
          elif [[ "$PRERELEASE" == "true" ]]; then
            echo "::warning::No release keystore secret: pre-release is signed with a throwaway key (NOT FOR FLEET)"
            keytool -genkeypair -keystore "$RUNNER_TEMP/throwaway.jks" -storepass throwaway -keypass throwaway \
              -alias throwaway -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=SimFone experimental" >/dev/null
            {
              echo "SIMFONE_KEYSTORE=$RUNNER_TEMP/throwaway.jks"
              echo "SIMFONE_KEYSTORE_PASSWORD=throwaway"
              echo "SIMFONE_KEY_ALIAS=throwaway"
              echo "SIMFONE_KEY_PASSWORD=throwaway"
            } >> "$props"
            echo "SIGNING=throwaway" >> "$GITHUB_ENV"
          else
            echo "::error::Stable releases need the SIMFONE_KEYSTORE_B64 secret"; exit 1
          fi
          [[ -z "$REQUEST_SIGNATURE" ]] && echo "::warning::SIMFONE_REQUEST_SIGNATURE not set: built with the placeholder (won't match a real server)"
          true

      # Maven Central sometimes rate-limits shared runners (HTTP 429): retry dependency resolution
      - name: Download dependencies
        if: steps.version.outputs.skip != 'true'
        run: |
          for i in 1 2 3; do
            ./gradlew --no-daemon :app:dependencies --configuration releaseRuntimeClasspath > /dev/null && exit 0
            echo "::warning::dependency download failed (attempt $i), retrying in $((i*60))s"; sleep $((i*60))
          done
          exit 1

      - name: Test
        if: steps.version.outputs.skip != 'true'
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build release APK
        if: steps.version.outputs.skip != 'true'
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Collect artifacts
        if: steps.version.outputs.skip != 'true'
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="dist/simfone-mdm-${SIMFONE_VERSION_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          CERT_SHA=$("$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          CHECKSUM=$(python3 -c "import base64,sys;print(base64.urlsafe_b64encode(bytes.fromhex(sys.argv[1])).decode().rstrip('='))" "$CERT_SHA")
          sha256sum "$APK" | sed 's| dist/||' > dist/SHA256SUMS
          cat > dist/notes.md <<EOF
          **SimFone MDM ${SIMFONE_VERSION_NAME}** (versionCode ${SIMFONE_VERSION_CODE})

          Signing: **${SIGNING}**$( [[ "$SIGNING" == throwaway ]] && echo ' - experimental, NOT FOR FLEET: cannot be updated by release-signed builds.' )

          QR \`PROVISIONING_DEVICE_ADMIN_SIGNATURE_CHECKSUM\`: \`${CHECKSUM}\`

          Certificate SHA-256: \`${CERT_SHA}\`

          Install on a test phone:
          \`\`\`
          adb install simfone-mdm-${SIMFONE_VERSION_NAME}.apk
          adb shell dpm set-device-owner com.simfone.mdm/.AdminReceiver
          \`\`\`
          EOF
          sed -i 's/^          //' dist/notes.md
          cat dist/notes.md

      - name: Publish GitHub release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=()
          [[ "$PRERELEASE" == "true" ]] && flags+=(--prerelease)
          gh release create "$TAG" dist/*.apk dist/SHA256SUMS \
            --title "SimFone MDM ${SIMFONE_VERSION_NAME}" --notes-file dist/notes.md \
            --target "$GITHUB_SHA" "${flags[@]}"
