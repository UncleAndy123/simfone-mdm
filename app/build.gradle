apply plugin: 'com.android.application'

repositories {
    google()
    mavenCentral()
}

// Optional release signing: put these in ~/.gradle/gradle.properties (never commit them)
//   SIMFONE_KEYSTORE=/path/to/simfone-release.jks
//   SIMFONE_KEYSTORE_PASSWORD=...
//   SIMFONE_KEY_ALIAS=simfone
//   SIMFONE_KEY_PASSWORD=...
def hasReleaseKey = project.hasProperty('SIMFONE_KEYSTORE')

android {
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.simfone.mdm"
        // Android 7.0+. Jackson is pinned to 2.11.4 below, which is the last
        // line that runs on API 24/25 (newer Jackson needs MethodHandles, API 26+).
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 100
        versionName "1.0.0"
        buildFeatures {
            aidl true
            buildConfig = true
        }
        namespace 'com.simfone.mdm'
        // Hidden settings code: *#*#7463#*#* (S-I-M-F)
        manifestPlaceholders = [secretCode: "7463"]

        // Default URL of the web panel (scheme + host!). Overridden by the QR code (com.hmdm.BASE_URL).
        buildConfigField("String", "BASE_URL", "\"https://mdm.simfone.example\"")
        // Secondary address of the web panel, called when the primary host is not available.
        buildConfigField("String", "SECONDARY_BASE_URL", "\"https://mdm.simfone.example\"")
        // Relative path of the web panel on the server. Keep it empty if installed in the root
        buildConfigField("String", "SERVER_PROJECT", "\"\"")
        // Headless: the device ID is never typed in. "serial", "imei" or "mac".
        buildConfigField("String", "DEVICE_ID_CHOICE", "\"serial\"")
        buildConfigField("String", "ENROLLMENT_CONFIG_KEY", "null")
        buildConfigField("String", "ENROLLMENT_CUSTOMER", "null")
        buildConfigField("String", "ENROLLMENT_GROUPS", "null")
        // MQTT port for Push notifications
        buildConfigField("Integer", "MQTT_PORT", "31000")
        buildConfigField("Boolean", "SYSTEM_PRIVILEGES", "false")
        buildConfigField("Boolean", "TRUST_ANY_CERTIFICATE", "false")
        // Shared secret to sign server config requests and MQTT messages. MUST match the server.
        // Override with -PSIMFONE_REQUEST_SIGNATURE=... (or gradle.properties) for release builds.
        buildConfigField("String", "REQUEST_SIGNATURE", "\"" + (project.findProperty('SIMFONE_REQUEST_SIGNATURE') ?: "simfone-CHANGE-ME-req") + "\"")
        // Check the server signature (protection against MITM)
        buildConfigField("Boolean", "CHECK_SIGNATURE", "false")
        // Foreground service for MQTT: prevents OS from killing MQTT service on weak devices
        buildConfigField("Boolean", "MQTT_SERVICE_FOREGROUND", "true")
        // API key for privileged hmdm-lib requests (launcher, KyCall, dpadsms). MUST match the companions.
        buildConfigField("String", "LIBRARY_API_KEY", "\"" + (project.findProperty('SIMFONE_LIBRARY_API_KEY') ?: "simfone-CHANGE-ME-lib") + "\"")
        // ECDSA P-256 public key (X.509 SubjectPublicKeyInfo, base64) that signs the fallback manifest.
        buildConfigField("String", "FALLBACK_MANIFEST_PUBLIC_KEY", "\"" + (project.findProperty('SIMFONE_MANIFEST_PUBKEY') ?: "") + "\"")
        // URL of the signed fallback manifest on a second provider (empty = disabled)
        buildConfigField("String", "FALLBACK_MANIFEST_URL", "\"" + (project.findProperty('SIMFONE_MANIFEST_URL') ?: "") + "\"")
        // Days the primary server must be unreachable (with working internet) before the manifest is checked
        buildConfigField("Integer", "FALLBACK_MANIFEST_AFTER_DAYS", "3")
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(SIMFONE_KEYSTORE)
                storePassword SIMFONE_KEYSTORE_PASSWORD
                keyAlias SIMFONE_KEY_ALIAS
                keyPassword SIMFONE_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
            if (hasReleaseKey) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES*', 'META-INF/LICENSE*', 'META-INF/NOTICE*',
                         'META-INF/notice.txt', 'META-INF/license.txt', 'META-INF/dependencies.txt',
                         'META-INF/LGPL2.1', 'META-INF/*.kotlin_module', 'META-INF/versions/**']
        }
    }

    // Jackson 2.12+ uses java.lang.invoke APIs that crash on Android 7 (API 24/25).
    configurations.all {
        resolutionStrategy {
            force 'com.fasterxml.jackson.core:jackson-databind:2.11.4'
            force 'com.fasterxml.jackson.core:jackson-core:2.11.4'
            force 'com.fasterxml.jackson.core:jackson-annotations:2.11.4'
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'

    // MQTT messaging
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.0'

    // Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-jackson:2.11.0'

    // Jackson (pinned, see above)
    implementation 'com.fasterxml.jackson.core:jackson-core:2.11.4'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.11.4'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.11.4'

    // Worker
    implementation 'androidx.work:work-runtime:2.9.1'

    implementation 'commons-io:commons-io:2.0.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}
